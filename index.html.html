<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Courier Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#121d30; --line:#26354d; --text:#eef4ff; --muted:#9aabc4; --accent:#3b82f6; }
    * { box-sizing:border-box; }
    body { margin:0; padding:22px 14px 40px; background:linear-gradient(160deg,#101c31,#080d17 70%); color:var(--text); font-family:Arial, sans-serif; }
    .wrap { max-width:620px; margin:0 auto; }
    header { text-align:center; margin:8px 0 22px; }
    .logo { width:58px; height:58px; display:grid; place-items:center; margin:0 auto 12px; border-radius:18px; background:#1d3b68; font-size:28px; }
    h1 { margin:0; font-size:27px; letter-spacing:.2px; }
    .sub { color:var(--muted); margin:8px 0 0; font-size:14px; }
    .panel { background:rgba(18,29,48,.96); border:1px solid var(--line); border-radius:18px; padding:16px; margin:14px 0; box-shadow:0 12px 30px #0003; }
    .panel h2 { margin:0 0 13px; font-size:17px; }
    #reader { width:100%; overflow:hidden; border-radius:12px; background:#070b12; }
    #reader video { border-radius:12px; }
    .buttons { display:flex; flex-wrap:wrap; gap:9px; margin-top:13px; }
    button { border:0; border-radius:11px; padding:12px 15px; color:white; background:var(--accent); font-weight:700; font-size:14px; cursor:pointer; }
    button.secondary { background:#293950; }
    button.danger { background:#8e3440; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .status { min-height:20px; color:var(--muted); font-size:13px; margin:10px 2px 0; }
    .manual { display:flex; gap:8px; }
    .manual input { min-width:0; flex:1; padding:12px; border:1px solid var(--line); border-radius:10px; background:#0b1423; color:white; font-size:15px; }
    .count { color:var(--muted); font-size:13px; }
    ol { list-style:none; margin:12px 0 0; padding:0; }
    li { display:flex; align-items:center; gap:10px; padding:11px 10px; border-top:1px solid var(--line); }
    .num { flex:1; min-width:0; overflow-wrap:anywhere; font-family:monospace; font-size:15px; }
    .time { display:block; color:var(--muted); font:11px Arial,sans-serif; margin-top:4px; }
    .copy-one { padding:8px 10px; background:#293950; }
    .empty { color:var(--muted); text-align:center; padding:20px 8px; font-size:14px; }
    footer { color:#71829b; text-align:center; font-size:12px; margin-top:22px; }
    @media (max-width:390px) { h1 {font-size:23px;} .manual {flex-direction:column;} .manual button {width:100%;} }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">📦</div>
    <h1>Courier Barcode Scanner</h1>
    <p class="sub">Scan parcel barcodes and keep a simple scan history</p>
  </header>

  <section class="panel">
    <h2>📷 Scan Barcode</h2>
    <div id="reader"></div>
    <div class="buttons">
      <button id="startBtn" onclick="startScanner()">Start Camera</button>
      <button id="stopBtn" class="secondary" onclick="stopScanner()" disabled>Stop Camera</button>
    </div>
    <p id="status" class="status">Tap “Start Camera” and allow camera access.</p>
  </section>

  <section class="panel">
    <h2>⌨️ Enter Barcode Manually</h2>
    <div class="manual">
      <input id="manualCode" type="text" placeholder="Enter parcel / tracking number" autocomplete="off">
      <button onclick="addManual()">Add Number</button>
    </div>
  </section>

  <section class="panel">
    <h2>📋 Scanned Parcels <span class="count" id="count">(0)</span></h2>
    <div class="buttons">
      <button onclick="copyAll()">Copy All</button>
      <button class="secondary" onclick="exportList()">Download CSV</button>
      <button class="danger" onclick="clearHistory()">Clear History</button>
    </div>
    <ol id="history"><li class="empty">No barcodes scanned yet.</li></ol>
  </section>
  <footer>Courier Barcode Scanner · Scan history is saved on this device</footer>
</div>

<script>
  let scanner = null;
  let scanning = false;
  let codes = [];
  const STORAGE_KEY = "courierBarcodeHistoryV2";

  function loadHistory() {
    try { codes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
    catch (_) { codes = []; }
    renderHistory();
  }
  function saveHistory() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(codes)); }
    catch (_) { setStatus("Could not save history on this browser."); }
  }
  function setStatus(message) { document.getElementById("status").textContent = message; }

  function addCode(value) {
    const code = String(value || "").trim();
    if (!code) return;
    if (codes.some(item => item.value === code)) {
      setStatus("Already scanned: " + code);
      return;
    }
    codes.unshift({ value: code, time: new Date().toLocaleString() });
    saveHistory();
    renderHistory();
    setStatus("Added: " + code);
  }

  function addManual() {
    const input = document.getElementById("manualCode");
    if (!input.value.trim()) { input.focus(); return; }
    addCode(input.value);
    input.value = "";
    input.focus();
  }
  document.getElementById("manualCode").addEventListener("keydown", e => {
    if (e.key === "Enter") addManual();
  });

  async function startScanner() {
    if (scanning) return;
    if (typeof Html5Qrcode === "undefined") {
      setStatus("Scanner library could not load. Check your internet connection and refresh.");
      return;
    }
    scanner = new Html5Qrcode("reader");
    document.getElementById("startBtn").disabled = true;
    setStatus("Starting camera…");
    try {
      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 270, height: 150 }, aspectRatio: 1.4 },
        decodedText => addCode(decodedText),
        () => {}
      );
      scanning = true;
      document.getElementById("stopBtn").disabled = false;
      setStatus("Camera is on. Point it at a parcel barcode.");
    } catch (err) {
      document.getElementById("startBtn").disabled = false;
      setStatus("Camera could not start. Allow camera access and open this page using HTTPS. " + (err && err.message ? err.message : ""));
      scanner = null;
    }
  }

  async function stopScanner() {
    if (!scanner || !scanning) return;
    try {
      await scanner.stop();
      await scanner.clear();
    } catch (_) {}
    scanner = null;
    scanning = false;
    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = true;
    setStatus("Camera stopped.");
  }

  function renderHistory() {
    const list = document.getElementById("history");
    document.getElementById("count").textContent = "(" + codes.length + ")";
    if (!codes.length) {
      list.innerHTML = '<li class="empty">No barcodes scanned yet.</li>';
      return;
    }
    list.innerHTML = "";
    codes.forEach((item, index) => {
      const li = document.createElement("li");
      const info = document.createElement("div");
      info.className = "num";
      info.appendChild(document.createTextNode(item.value));
      const time = document.createElement("span");
      time.className = "time";
      time.textContent = item.time || "";
      info.appendChild(time);
      const btn = document.createElement("button");
      btn.className = "copy-one";
      btn.textContent = "Copy";
      btn.onclick = () => copyText(item.value);
      li.appendChild(info);
      li.appendChild(btn);
      list.appendChild(li);
    });
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      setStatus("Copied to clipboard.");
    } catch (_) {
      const area = document.createElement("textarea");
      area.value = text; document.body.appendChild(area);
      area.select(); document.execCommand("copy"); area.remove();
      setStatus("Copied to clipboard.");
    }
  }
  function copyAll() {
    if (!codes.length) { setStatus("There are no barcodes to copy."); return; }
    copyText(codes.map(item => item.value).join("\n"));
  }
  function exportList() {
    if (!codes.length) { setStatus("There are no barcodes to download."); return; }
    const rows = [["Barcode", "Scanned time"], ...codes.map(item => [item.value, item.time])];
    const csv = rows.map(row => row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "courier-scan-history.csv"; a.click();
    URL.revokeObjectURL(url);
    setStatus("CSV downloaded.");
  }
  function clearHistory() {
    if (!codes.length) return;
    if (!confirm("Clear all scanned barcodes?")) return;
    codes = []; saveHistory(); renderHistory(); setStatus("Scan history cleared.");
  }

  loadHistory();
</script>
</body>
</html>
